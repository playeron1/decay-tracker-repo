[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decay-tracker"
version = "0.1.0"
description = "Attack-surface decay tracker for abandoned cloud resources"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "boto3>=1.34",
    "requests>=2.31",
]

[project.optional-dependencies]
dns = ["dnspython>=2.5"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "moto[s3,ec2,elbv2,route53,sts]>=5.0", "ruff>=0.4"]

[project.scripts]
decay-tracker = "decay_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
